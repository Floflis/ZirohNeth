name: Python dependency and syntax check
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q src
      - run: python -m pip install pytest mock
      - name: Run hashfield v2 unit test
        run: PYTHONPATH=src python -m pytest --noconftest -q src/Test/TestPeerHashfield.py
      - name: Run IPv6 and mesh helper tests
        run: PYTHONPATH=src python -m pytest -q src/Test/TestHelper.py
      - run: PYTHONPATH=src python -m pytest --noconftest -q src/Test/TestCryptEthereum.py src/Test/TestCryptMigration.py src/Test/TestMigrationWorkflow.py
